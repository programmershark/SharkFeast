<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharkFeast - Main Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sign Up / Sign In Modal Overlay (Visible on initial load if logged out) -->
    <div id="auth-modal-overlay" class="lobby-browser-overlay">
        <div class="lobby-browser-card" style="width: 400px; text-align: left;">
            <div style="text-align: center; margin-bottom: 20px;">
                <h2 style="color: #38bdf8; font-size: 24px;">🦈 SharkFeast</h2>
                <p id="auth-subtitle" style="font-size: 12px; color: #94a3b8; margin-top: 4px;">Enter the Oceanic Waters</p>
            </div>

            <!-- Tab Switcher for Sign Up / Sign In -->
            <div style="display: flex; gap: 6px; margin-bottom: 16px; background: #030712; padding: 4px; border-radius: 6px; border: 1px solid #334155;">
                <button id="auth-tab-signup" class="tab-btn" style="flex: 1; text-align: center; background: transparent; color: #fff; border: none; padding: 6px; border-radius: 4px; cursor: pointer;">Sign Up</button>
                <button id="auth-tab-signin" class="tab-btn active" style="flex: 1; text-align: center; background: #fff; color: #000; border: none; padding: 6px; border-radius: 4px; cursor: pointer;">Sign In</button>
            </div>

            <div id="auth-error-banner" class="hidden" style="background: #7f1d1d; border: 1px solid #dc2626; color: #fca5a5; padding: 8px; border-radius: 4px; font-size: 12px; margin-bottom: 12px;"></div>

            <div style="display: flex; flex-direction: column; gap: 12px;">
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <label style="font-size: 11px; color: #94a3b8;">Username:</label>
                    <input type="text" id="auth-username-input" placeholder="Enter username..." style="padding: 8px 12px; background: #030712; border: 1px solid #334155; color: white; border-radius: 6px; font-size: 13px; outline: none;">
                </div>

                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <label style="font-size: 11px; color: #94a3b8;">Password:</label>
                    <input type="password" id="auth-password-input" placeholder="Enter password..." style="padding: 8px 12px; background: #030712; border: 1px solid #334155; color: white; border-radius: 6px; font-size: 13px; outline: none;">
                </div>

                <button id="auth-submit-btn" class="primary-btn" style="background: #22c55e; margin-top: 8px; width: 100%; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; color: white;">Sign In</button>
            </div>
        </div>
    </div>

    <!-- Main Lobby Browser View -->
    <div id="lobby-browser-container" class="lobby-browser-overlay hidden">
        <div class="lobby-browser-card" style="width: 550px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="color: #38bdf8; margin-bottom: 0;">🌊 SharkFeast Lobbies</h2>
                <div style="font-size: 12px; color: #94a3b8;">Logged in as: <span id="current-user-display" style="color: #38bdf8; font-weight: bold;">-</span></div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <button id="open-create-modal-btn" class="primary-btn" style="background: #0284c7; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold;">+ Create Lobby</button>
                <div id="user-profile-badge" style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
                    <div id="user-avatar-placeholder" style="width: 32px; height: 32px; background: #334155; border-radius: 50%; display: flex; align-items: center; justify-content: center;">🦈</div>
                    <span id="user-display-name" style="font-size: 13px; color: #38bdf8; font-weight: bold;">-</span>
                </div>
            </div>

            <div id="public-lobbies-list" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; max-height: 300px; overflow-y: auto;">
                <!-- Dynamically populated public lobbies -->
            </div>
        </div>
    </div>

    <!-- Create Lobby Modal -->
    <div id="create-modal" class="lobby-browser-overlay hidden" style="position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center; z-index:9999;">
        <div class="lobby-browser-card" style="width: 350px; background: #0f172a; padding: 20px; border-radius: 12px; border: 1px solid #334155; color: white;">
            <h3 style="color: #38bdf8; margin-top: 0;">Create New Lobby</h3>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;">
                <label style="font-size: 12px; color: #94a3b8;">Lobby Name:</label>
                <input type="text" id="new-lobby-name-input" placeholder="e.g. Oceanic Showdown" style="padding: 8px; background: #030712; border: 1px solid #334155; color: white; border-radius: 6px;">
                <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #cbd5e1; cursor: pointer;">
                    <input type="checkbox" id="private-lobby-checkbox"> Private Lobby
                </label>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button id="cancel-create-modal-btn" class="secondary-btn" style="background: #334155; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">Cancel</button>
                <button id="confirm-create-lobby-btn" class="primary-btn" style="background: #22c55e; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">Create</button>
            </div>
        </div>
    </div>

    <!-- Staff Admin Modal -->
    <div id="admin-modal" class="hidden" style="position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center; z-index:99999;"></div>

    <!-- Hidden secret management trigger -->
    <button id="secret-lobby-viewer-btn" class="hidden">Staff Console</button>

    <!-- Main Game Lobby Screen View -->
    <div id="lobby-screen" class="hidden" style="display: flex; width: 100vw; height: 100vh;">
        <!-- Left Sidebar -->
        <div id="chat-sidebar" style="width: 280px; background: #0f172a; border-right: 1px solid #1e293b; display: flex; flex-direction: column;">
            <div class="chat-header" style="padding: 12px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center;">
                <div class="sidebar-tabs" style="display: flex; gap: 4px;">
                    <button class="sidebar-tab-btn active" data-pane="lobby-chat-pane" style="background:#1e293b; border:none; color:white; padding:4px 8px; border-radius:4px; font-size:11px; cursor:pointer;">Chat</button>
                    <button class="sidebar-tab-btn" data-pane="lobby-players-tab-pane" style="background:transparent; border:none; color:#94a3b8; padding:4px 8px; border-radius:4px; font-size:11px; cursor:pointer;">Players</button>
                    <button class="sidebar-tab-btn" data-pane="lobby-settings-pane" style="background:transparent; border:none; color:#94a3b8; padding:4px 8px; border-radius:4px; font-size:11px; cursor:pointer;">Settings</button>
                </div>
                <button id="chat-toggle-btn" style="background:none; border:none; color:#94a3b8; cursor:pointer;">&lt;----</button>
            </div>

            <div class="chat-content" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative;">
                <!-- Chat Pane -->
                <div id="lobby-chat-pane" class="sidebar-pane" style="flex: 1; display: flex; flex-direction: column; padding: 10px; overflow: hidden;">
                    <div id="chat-messages" style="flex: 1; overflow-y: auto; font-size: 12px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px;"></div>
                    <form id="chat-input-form" style="display: flex; gap: 4px;">
                        <input type="text" id="chat-input-field" placeholder="Type message..." style="flex: 1; padding: 6px 10px; background: #030712; border: 1px solid #334155; color: white; border-radius: 4px; font-size: 12px; outline: none;">
                    </form>
                </div>

                <!-- Players Pane -->
                <div id="lobby-players-tab-pane" class="sidebar-pane hidden" style="flex: 1; padding: 10px; overflow-y: auto; font-size: 12px;"></div>

                <!-- Settings Pane -->
                <div id="lobby-settings-pane" class="sidebar-pane hidden" style="flex: 1; padding: 10px; font-size: 12px; display: flex; flex-direction: column; gap: 10px;">
                    <div style="font-weight: bold; color: #38bdf8;">Lobby Options</div>
                    <label style="font-size: 11px; color: #94a3b8;">Rules / Description:</label>
                    <textarea id="lobby-rules-input" style="background:#030712; color:white; border:1px solid #334155; border-radius:4px; padding:6px; font-size:11px; resize:none; height:60px;"></textarea>
                    <label style="font-size: 11px; color: #94a3b8;">Game Mode:</label>
                    <select id="lobby-gamemode-select" style="background:#030712; color:white; border:1px solid #334155; border-radius:4px; padding:6px; font-size:11px;">
                        <option value="Standard">Standard</option>
                        <option value="Speed Round">Speed Round</option>
                        <option value="Survival">Survival</option>
                    </select>
                    <label style="font-size: 11px; color: #94a3b8;">Max Lives: <span id="lobby-lives-val">3</span></label>
                    <input type="range" id="lobby-lives-range" min="1" max="10" value="3" style="width:100%;">
                    <button id="save-lobby-settings-btn" class="primary-btn" style="background:#0284c7; color:white; border:none; padding:6px; border-radius:4px; font-weight:bold; cursor:pointer; margin-top:4px;">Save Settings</button>
                    <p id="settings-readonly-note" class="hidden" style="font-size:10px; color:#8b949e; margin-top:2px;">Only the lobby host can change these settings.</p>
                </div>
            </div>
        </div>

        <!-- Main Game Area -->
        <main id="main-game-area" style="flex: 1; display: flex; flex-direction: column; background: #030712;">
            <div class="lobby-top-bar" style="padding: 12px 20px; background: #0f172a; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <strong id="current-lobby-name-header" style="color: #38bdf8; font-size: 16px;">Oceanic Showdown Arena</strong>
                    <span id="server-type-badge-header" class="badge public-badge" style="margin-left: 8px; font-size: 10px; padding: 2px 6px; background: #0284c7; border-radius: 4px; color: white;">Public Lobby</span>
                </div>
                <button id="leave-lobby-btn" class="primary-btn" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px;">Leave Lobby</button>
            </div>

            <div class="arena-container" style="flex: 1; padding: 20px; overflow-y: auto;">
                <div id="player-seating-grid"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
